<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الهدايا — أنتيمك</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .glevel{margin-bottom:16px}
  .glevel h3{font-size:13px; color:var(--ink-soft); margin:0 0 8px; display:flex; align-items:center; gap:6px}
  .grow{display:flex; gap:10px; overflow-x:auto; padding-bottom:4px}
  .gift{flex:0 0 100px; background:var(--white); border:1px solid var(--line); border-radius:14px;
    padding:12px 8px; text-align:center; box-shadow:var(--shadow)}
  .gift .ic{font-size:26px; margin-bottom:6px}
  .gift .nm{font-size:11.5px; font-weight:700; min-height:28px}
  .gift .pr{font-size:11px; color:var(--red-deep); font-weight:800; margin-top:4px}
  .gift.locked{opacity:.55}
  .gift.locked .ic{filter:grayscale(1)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a href="index.html"><img class="logo" src="assets/logo.svg" alt="anteemak"></a>
    <span class="balance">💰 <b>4,320</b> كوين</span></div>
  <main>
    <p class="eyebrow">معاينة 13.5</p>
    <h1>هدايا أنتيمك</h1>
    <p class="sub">100 هدية عبر 20 مستوى، بتتفتح تدريجياً. القيمة بتتسجل للبائعة بالكامل وتتحول لكاش وقت السحب حسب رتبتها.</p>
    <div id="levels"></div>
  </main>
  <div class="tabbar">
    <a href="login.html"><b>◎</b>دخول</a>
    <a href="register.html"><b>✎</b>تسجيل</a>
    <a href="profile.html"><b>◐</b>بروفايل</a>
    <a href="store.html"><b>▤</b>النقط</a>
    <a class="on" href="gifts.html"><b>❀</b>هدايا</a>
  </div>
</div>
<script>
const real={
 1:{ic:"☕",nm:"عزومة قهوة",pr:"500 نقطة"},
 3:{ic:"🍫",nm:"وافل/شوكولاتة",pr:"1,000 نقطة"},
 5:{ic:"🍕",nm:"شريحة بيتزا",pr:"2,000 نقطة"},
 10:{ic:"🚗",nm:"توصيلة أوبر",pr:"5,000 نقطة"},
 20:{ic:"💐",nm:"بوكيه ورد أنتيمك",pr:"10,000 نقطة"},
};
const box=document.getElementById('levels');
for(let lvl=1; lvl<=20; lvl++){
  const wrap=document.createElement('div'); wrap.className='glevel';
  wrap.innerHTML=`<h3>مستوى ${lvl} ${lvl in real ? '' : '<span class="chip">قريباً</span>'}</h3><div class="grow"></div>`;
  const row=wrap.querySelector('.grow');
  for(let i=0;i<5;i++){
    const g=document.createElement('div');
    if(lvl in real && i===0){
      const x=real[lvl];
      g.className='gift'; g.innerHTML=`<div class="ic">${x.ic}</div><div class="nm">${x.nm}</div><div class="pr">${x.pr}</div>`;
    } else {
      g.className='gift locked'; g.innerHTML=`<div class="ic">🎁</div><div class="nm">هدية ${lvl}.${i+1}</div><div class="pr">قريباً</div>`;
    }
    row.appendChild(g);
  }
  box.appendChild(wrap);
}
</script>
</body>
</html>
