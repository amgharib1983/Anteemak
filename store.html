<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>متجر النقط — أنتيمك</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .pack{display:flex; align-items:center; justify-content:space-between; gap:12px;
    border:1.5px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:10px; cursor:pointer; background:var(--white)}
  .pack.best{border-color:var(--gold); background:#fffaea}
  .pack.on{border-color:var(--red); box-shadow:0 0 0 3px #fdecec}
  .pack .coins{font-weight:900; font-size:16px}
  .pack .unit{font-size:11px; color:var(--ink-soft)}
  .pack .price{font-weight:900; font-size:17px; color:var(--red-deep)}
  .best-tag{position:relative; top:-10px; display:inline-block; background:var(--gold); color:#3a2a00;
    font-size:10.5px; font-weight:800; padding:2px 9px; border-radius:99px; margin-bottom:-6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a href="index.html"><img class="logo" src="assets/logo.svg" alt="anteemak"></a>
    <span class="balance">💰 <b>4,320</b> كوين</span></div>
  <main>
    <p class="eyebrow">معاينة 13.4</p>
    <h1>اشحن نقطك</h1>
    <p class="sub">كل ما تشحن باقة أكبر، سعر النقطة يبقى أحسن — والسعر الرسمي 1 قرش للنقطة مبيقلّش أبداً.</p>

    <div id="packs"></div>

    <button class="btn btn-primary" id="pay" style="margin-top:6px">اشحن الباقة المختارة</button>
    <p class="hint" style="text-align:center; margin-top:10px">بوابة الدفع (Paymob / Fawry) — لسه مش موصولة، معاينة بس.</p>
  </main>
  <div class="tabbar">
    <a href="login.html"><b>◎</b>دخول</a>
    <a href="register.html"><b>✎</b>تسجيل</a>
    <a href="profile.html"><b>◐</b>بروفايل</a>
    <a class="on" href="store.html"><b>▤</b>النقط</a>
    <a href="gifts.html"><b>❀</b>هدايا</a>
  </div>
</div>
<script>
const packs=[
 {p:50,c:4000,u:"1.250 قرش/نقطة"},
 {p:100,c:9000,u:"1.111 قرش/نقطة"},
 {p:150,c:14000,u:"1.071 قرش/نقطة"},
 {p:250,c:23000,u:"1.087 قرش/نقطة"},
 {p:500,c:48000,u:"1.042 قرش/نقطة"},
 {p:1000,c:100000,u:"1.000 قرش/نقطة (مرجعي)"},
];
const box=document.getElementById('packs');
let chosen=null;
packs.forEach((x,i)=>{
  const best=x.p===1000;
  const d=document.createElement('div');
  d.className='pack'+(best?' best':'');
  d.innerHTML = (best?'<div class="best-tag">الأفضل توفيراً</div>':'') +
    `<div><div class="coins">${x.c.toLocaleString()} نقطة</div><div class="unit">${x.u}</div></div>
     <div class="price">${x.p} ج.م</div>`;
  d.onclick=()=>{document.querySelectorAll('.pack').forEach(p=>p.classList.remove('on'));d.classList.add('on');chosen=x;};
  box.appendChild(d);
});
document.getElementById('pay').onclick=()=>{
  if(!chosen){alert('اختار باقة الأول 🙂');return;}
  alert(`معاينة فقط — هتدفع ${chosen.p} جنيه وتاخد ${chosen.c.toLocaleString()} نقطة.`);
};
</script>
</body>
</html>
